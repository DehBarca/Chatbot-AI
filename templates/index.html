<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Chatbot AI con múltiples proveedores: Gemini, OpenRouter y Together.Procesamiento de archivos PDF y conversaciones inteligentes."
    />
    <meta
      name="keywords"
      content="chatbot, AI, artificial intelligence, PDF, gemini, openrouter, together"
    />
    <meta name="author" content="DehBarca" />
    <title>🤖 AI Chatbot - Multi-Provider Assistant</title>
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h1><i class="fas fa-robot me-2"></i>AI Chatbot</h1>
        <small class="text-muted">Multi-Provider Assistant</small>
      </div>
      <!-- Message bubbles -->
      <div class="chat-messages" id="messages"></div>
      <!-- Input bar -->
      <div class="chat-input">
        <!-- Top part -->
        <div class="input-top">
          <input
            id="userInput"
            type="text"
            placeholder="Type your message..."
          />
        </div>
        <!-- Bottom part -->
        <div class="input-bottom">
          <button
            type="button"
            class="btn btn-outline-primary upload-btn"
            data-bs-toggle="modal"
            data-bs-target="#Archivos"
            aria-label="Subir archivo PDF"
            title="Subir archivo PDF"
          >
            <img src="{{ url_for('static', filename='icons/clip.svg') }}"
            alt="Send" width="30" height="30"" alt="Upload" />
          </button>
          <select id="fileSelect" class="form-select archive"></select>
          <div class="bottom-middle"></div>
          <select
            id="modelSelect"
            class="form-select model"
            aria-label="Seleccionar modelo de AI"
            title="Modelo de inteligencia artificial"
          ></select>
          <button class="send-btn" onclick="sendMessage()">
            <img src="{{ url_for('static', filename='icons/send.svg') }}"
            alt="Send" width="30" height="30"" alt="Send" />
          </button>
        </div>
      </div>
    </div>

    <!-- File Upload Modal -->
    <div
      class="modal fade"
      id="Archivos"
      tabindex="-1"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      role="dialog"
      aria-labelledby="modalTitleId"
      aria-describedby="modalDescriptionId"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
        role="document"
      >
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitleId">
              <i class="fas fa-upload me-2"></i>Subir Archivos PDF
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar modal"
            ></button>
          </div>

          <div class="modal-body">
            <p id="modalDescriptionId" class="text-muted small mb-3">
              Sube archivos PDF para que el AI pueda analizar su contenido y
              responder preguntas específicas.
            </p>

            <form id="uploadForm" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="fileInput" class="form-label"
                  >Seleccionar archivos PDF:</label
                >
                <input
                  type="file"
                  name="file"
                  id="fileInput"
                  class="form-control"
                  multiple
                  accept=".pdf"
                  aria-describedby="fileHelp"
                />
                <div id="fileHelp" class="form-text">
                  Puedes subir múltiples archivos PDF (máximo 10MB cada uno).
                </div>
              </div>

              <!-- Upload progress -->
              <div id="uploadProgress" class="d-none">
                <div class="progress mb-2">
                  <div
                    class="progress-bar"
                    role="progressbar"
                    style="width: 0%"
                    aria-valuenow="0"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
                <small class="text-muted">Subiendo archivos...</small>
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              onclick="resetUploadModal()"
            >
              <i class="fas fa-times me-1"></i>Cancelar
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="uploadFile()"
              id="uploadButton"
            >
              <i class="fas fa-cloud-upload-alt me-1"></i>Subir
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Import external JavaScript file -->
    <script src="{{ url_for('static', filename='scripts/index.js') }}"></script>

    <!-- Import bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
